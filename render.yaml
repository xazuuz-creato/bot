services:
  - type: web
    name: openstudio-ai
    runtime: docker
    plan: starter

    healthCheckPath: /api/health

    envVars:
      - key: DATA_DIR
        value: /srv/data

      - key: OLLAMA_URL
        sync: false

      - key: OLLAMA_MODEL
        value: qwen2.5:7b

      - key: SENTRY_DSN
        sync: false
